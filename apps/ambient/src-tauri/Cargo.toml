[package]
name = "nexus-ambient"
version = "0.1.0"
description = "NEXUS Ambient Desktop HUD — Native macOS Floating Capsule"
authors = ["Pushkar Patel <pushkar@nexus.local>"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
